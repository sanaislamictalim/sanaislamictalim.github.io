<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Madhubani Prayer Time</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #155e52, transparent 40%),
        linear-gradient(145deg, #041d1a, #06332d 60%, #021613);
      color: #fff;
      padding: 18px;
    }

    .app {
      max-width: 620px;
      margin: auto;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 10px 0 20px;
    }

    .mosque {
      font-size: 42px;
      margin-bottom: 5px;
    }

    .header h1 {
      font-size: 28px;
      color: #f4d77b;
    }

    .location {
      margin-top: 6px;
      opacity: .75;
      font-size: 14px;
    }

    /* Clock */
    .clock-card {
      text-align: center;
      padding: 25px 15px;
      border-radius: 24px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
      margin-bottom: 20px;
    }

    #clock {
      font-size: 44px;
      font-weight: 700;
      color: #f4d77b;
      letter-spacing: 1px;
    }

    #today {
      margin-top: 8px;
      font-size: 14px;
      opacity: .75;
    }

    /* Current Prayer */
    .next-card {
      background: linear-gradient(135deg, #c99a35, #80601d);
      padding: 18px;
      border-radius: 20px;
      margin-bottom: 20px;
      text-align: center;
    }

    .next-card small {
      opacity: .85;
    }

    #nextPrayer {
      font-size: 23px;
      margin-top: 5px;
      font-weight: bold;
    }

    /* Section */
    .section-title {
      margin: 22px 3px 12px;
      font-size: 19px;
      color: #f4d77b;
    }

    /* Prayer */
    .prayer-list {
      display: grid;
      gap: 10px;
    }

    .prayer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 17px 18px;
      border-radius: 17px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.08);
      transition: .2s;
    }

    .prayer:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,.11);
    }

    .prayer-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: rgba(244,215,123,.12);
      font-size: 20px;
    }

    .prayer-name {
      font-size: 17px;
      font-weight: bold;
    }

    .prayer-sub {
      font-size: 11px;
      opacity: .55;
      margin-top: 3px;
    }

    .prayer-time {
      font-size: 19px;
      font-weight: bold;
      color: #f4d77b;
    }

    /* Special */
    .special {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .special-box {
      padding: 17px;
      border-radius: 17px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.08);
    }

    .special-box .emoji {
      font-size: 23px;
    }

    .special-box h3 {
      margin-top: 8px;
      font-size: 15px;
    }

    .special-box p {
      margin-top: 5px;
      color: #f4d77b;
      font-size: 18px;
      font-weight: bold;
    }

    /* Loading */
    #loading {
      text-align: center;
      padding: 20px;
      opacity: .7;
    }

    /* Footer */
    footer {
      text-align: center;
      margin: 25px 0 8px;
      font-size: 12px;
      opacity: .5;
    }

    @media(max-width:480px) {
      #clock {
        font-size: 36px;
      }

      .header h1 {
        font-size: 24px;
      }

      .special {
        grid-template-columns: 1fr 1fr;
      }

      .prayer {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="mosque">🕌</div>
    <h1>Prayer Time</h1>
    <div class="location">
      Madhubani, Bihar, India
    </div>
  </div>

  <!-- LIVE CLOCK -->
  <div class="clock-card">
    <div id="clock">00:00:00</div>
    <div id="today">Loading date...</div>
  </div>

  <!-- NEXT PRAYER -->
  <div class="next-card">
    <small>Next Prayer</small>
    <div id="nextPrayer">Loading...</div>
  </div>

  <div class="section-title">
    🕌 Aaj Ke Namaz Ke Auqaat
  </div>

  <div id="loading">
    Prayer timings load ho rahe hain...
  </div>

  <div class="prayer-list" id="prayerList"></div>

  <div class="section-title">
    ✨ Special Times
  </div>

  <div class="special">

    <div class="special-box">
      <div class="emoji">☀️</div>
      <h3>Zawal</h3>
      <p id="zawal">--:--</p>
    </div>

    <div class="special-box">
      <div class="emoji">🌙</div>
      <h3>Tahajjud</h3>
      <p id="tahajjud">--:--</p>
    </div>

    <div class="special-box">
      <div class="emoji">🍽️</div>
      <h3>Sehri End</h3>
      <p id="sehri">--:--</p>
    </div>

    <div class="special-box">
      <div class="emoji">🌇</div>
      <h3>Iftar</h3>
      <p id="iftar">--:--</p>
    </div>

  </div>

  <footer>
    Original Prayer Time • Madhubani, Bihar
  </footer>

</div>


<script>

/* =====================================================
   BASIC SETTINGS
   ===================================================== */

const CITY = "Madhubani";
const COUNTRY = "India";

/*
   1 = University of Islamic Sciences, Karachi
   2 = ISNA
   3 = Muslim World League
   4 = Umm Al-Qura
   5 = Egyptian General Authority

   Karachi method is commonly used in South Asia.
*/
const METHOD = 1;


/* =====================================================
   LIVE CLOCK
   ===================================================== */

function updateClock() {

  const now = new Date();

  const time = now.toLocaleTimeString("en-IN", {
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: true
  });

  const date = now.toLocaleDateString("en-IN", {
    weekday: "long",
    day: "numeric",
    month: "long",
    year: "numeric"
  });

  document.getElementById("clock").textContent = time;
  document.getElementById("today").textContent = date;
}

updateClock();
setInterval(updateClock, 1000);


/* =====================================================
   GET TODAY'S DATE
   ===================================================== */

function getToday() {

  const now = new Date();

  const day = String(now.getDate()).padStart(2, "0");
  const month = String(now.getMonth() + 1).padStart(2, "0");
  const year = now.getFullYear();

  return `${day}-${month}-${year}`;
}


/* =====================================================
   FORMAT TIME
   ===================================================== */

function formatTime(time24) {

  if (!time24) return "--:--";

  const parts = time24.split(":");

  let hour = parseInt(parts[0]);
  const minute = parts[1];

  const ampm = hour >= 12 ? "PM" : "AM";

  hour = hour % 12;

  if (hour === 0) hour = 12;

  return `${String(hour).padStart(2,"0")}:${minute} ${ampm}`;
}


/* =====================================================
   PRAYER DATA
   ===================================================== */

let prayerTimes = [];


/* =====================================================
   LOAD PRAYER TIMES
   ===================================================== */

async function loadPrayerTimes() {

  const date = getToday();

  const url =
    `https://api.aladhan.com/v1/timingsByCity/${date}` +
    `?city=${encodeURIComponent(CITY)}` +
    `&country=${encodeURIComponent(COUNTRY)}` +
    `&method=${METHOD}`;

  try {

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("Network error");
    }

    const result = await response.json();

    if (result.code !== 200) {
      throw new Error("API error");
    }

    const timings = result.data.timings;

    prayerTimes = [
      {
        name: "Fajr",
        urdu: "فجر",
        icon: "🌅",
        time: timings.Fajr
      },
      {
        name: "Dhuhr",
        urdu: "ظہر",
        icon: "☀️",
        time: timings.Dhuhr
      },
      {
        name: "Asr",
        urdu: "عصر",
        icon: "🌤️",
        time: timings.Asr
      },
      {
        name: "Maghrib",
        urdu: "مغرب",
        icon: "🌇",
        time: timings.Maghrib
      },
      {
        name: "Isha",
        urdu: "عشاء",
        icon: "🌙",
        time: timings.Isha
      }
    ];

    displayPrayerTimes(timings);

  } catch (error) {

    document.getElementById("loading").innerHTML =
      "⚠️ Prayer timings load nahi ho paaye. Internet connection check karein.";

    console.error(error);
  }
}


/* =====================================================
   DISPLAY PRAYER TIMES
   ===================================================== */

function displayPrayerTimes(timings) {

  document.getElementById("loading").style.display = "none";

  const list = document.getElementById("prayerList");

  list.innerHTML = "";

  prayerTimes.forEach(prayer => {

    const item = document.createElement("div");

    item.className = "prayer";

    item.innerHTML = `
      <div class="prayer-left">

        <div class="icon">
          ${prayer.icon}
        </div>

        <div>
          <div class="prayer-name">
            ${prayer.name}
          </div>

          <div class="prayer-sub">
            ${prayer.urdu}
          </div>
        </div>

      </div>

      <div class="prayer-time">
        ${formatTime(prayer.time)}
      </div>
    `;

    list.appendChild(item);

  });


  /* Sehri = Fajr */
  document.getElementById("sehri").textContent =
    formatTime(timings.Fajr);


  /* Iftar = Maghrib */
  document.getElementById("iftar").textContent =
    formatTime(timings.Maghrib);


  /* Sunrise and Sunset */
  const sunrise = timings.Sunrise;
  const sunset = timings.Sunset;
  const dhuhr = timings.Dhuhr;


  /*
     Approximate Zawal:
     midpoint between Sunrise and Sunset
  */

  const zawal = midpointTime(sunrise, sunset);

  document.getElementById("zawal").textContent =
    formatTime(zawal);


  /*
     Approximate Tahajjud:
     midpoint of night calculation.
     Tahajjud starts after Isha and ends before Fajr.
  */

  const tahajjud = tahajjudStart(timings.Isha, timings.Fajr);

  document.getElementById("tahajjud").textContent =
    formatTime(tahajjud);


  updateNextPrayer();

}


/* =====================================================
   MIDPOINT
   ===================================================== */

function midpointTime(start, end) {

  const s = timeToMinutes(start);
  const e = timeToMinutes(end);

  let difference = e - s;

  if (difference < 0) {
    difference += 1440;
  }

  const middle = s + difference / 2;

  return minutesToTime(middle % 1440);
}


/* =====================================================
   TAHAJJUD START
   ===================================================== */

function tahajjudStart(isha, fajr) {

  let i = timeToMinutes(isha);
  let f = timeToMinutes(fajr);

  if (f <= i) {
    f += 1440;
  }

  /*
     Last third of night:
     Tahajjud start = Isha + 2/3 of night duration
  */

  const night = f - i;

  const start = i + (night * 2 / 3);

  return minutesToTime(start % 1440);
}


/* =====================================================
   TIME CONVERTER
   ===================================================== */

function timeToMinutes(time) {

  const parts = time.split(":");

  return parseInt(parts[0]) * 60 +
         parseInt(parts[1]);

}


function minutesToTime(minutes) {

  minutes = Math.round(minutes);

  const h = Math.floor(minutes / 60);
  const m = minutes % 60;

  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;

}


/* =====================================================
   NEXT PRAYER
   ===================================================== */

function updateNextPrayer() {

  if (!prayerTimes.length) return;

  const now = new Date();

  const currentMinutes =
    now.getHours() * 60 +
    now.getMinutes();


  let next = null;


  for (const prayer of prayerTimes) {

    const pTime =
      timeToMinutes(prayer.time);

    if (pTime > currentMinutes) {

      next = prayer;
      break;

    }

  }


  /*
     If all prayers are finished,
     next prayer is tomorrow's Fajr.
  */

  if (!next) {

    next = prayerTimes[0];

    document.getElementById("nextPrayer").textContent =
      `Tomorrow • ${next.name} • ${formatTime(next.time)}`;

  } else {

    document.getElementById("nextPrayer").textContent =
      `${next.name} • ${formatTime(next.time)}`;

  }

}


/* =====================================================
   START
   ===================================================== */

loadPrayerTimes();


/*
   Refresh prayer information every 30 minutes.
*/
setInterval(loadPrayerTimes, 30 * 60 * 1000);


/*
   Update next prayer every minute.
*/
setInterval(updateNextPrayer, 60 * 1000);

</script>

</body>
</html>
