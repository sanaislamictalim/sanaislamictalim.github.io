<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sana Islamic - Qibla Finder</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#061743;
color:white;
text-align:center;
}

.header{
height:65px;
background:#4055b8;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
}

.header h2{
margin:0;
font-size:25px;
}

.menu{
font-size:30px;
}

.main{
min-height:calc(100vh - 65px);
padding:20px 10px 40px;

background:
radial-gradient(
circle at 50% 35%,
#178bd8 0%,
#17439e 38%,
#061743 90%
);
}

h1{
font-size:28px;
margin:10px 0;
}

.info{
font-size:16px;
margin-bottom:15px;
}

button{
border:0;
border-radius:10px;
padding:13px 22px;
margin:5px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

#startBtn{
background:white;
color:#222;
}

#calibrateBtn{
background:#12a9e0;
color:white;
display:none;
}

.qiblaBox{
position:relative;
width:350px;
height:500px;
max-width:95vw;
margin:20px auto;
overflow:hidden;
border-radius:25px;

background:
linear-gradient(
to bottom,
#0b4394 0%,
#1684cf 52%,
#071b4f 53%,
#041337 100%
);

box-shadow:
0 0 30px rgba(0,0,0,.6);
}

.stars{
position:absolute;
top:20px;
left:0;
width:100%;
font-size:22px;
opacity:.8;
z-index:1;
}

.compassDial{
position:absolute;
width:310px;
height:310px;
left:50%;
top:35px;

transform:
translateX(-50%)
rotate(0deg);

border-radius:50%;
border:3px solid rgba(255,255,255,.7);

transition:
transform .12s ease-out;

z-index:3;
}

.compassDial:before{
content:"";
position:absolute;
inset:15px;
border-radius:50%;
border:2px solid rgba(255,255,255,.35);
}

.direction{
position:absolute;
font-size:24px;
font-weight:bold;
}

.n{
top:8px;
left:50%;
transform:translateX(-50%);
}

.s{
bottom:8px;
left:50%;
transform:translateX(-50%);
}

.e{
right:10px;
top:50%;
transform:translateY(-50%);
}

.w{
left:10px;
top:50%;
transform:translateY(-50%);
}

.mark{
position:absolute;
left:50%;
top:0;
width:2px;
height:15px;
background:white;
transform-origin:155px 155px;
}

.m1{transform:rotate(45deg);}
.m2{transform:rotate(90deg);}
.m3{transform:rotate(135deg);}
.m4{transform:rotate(180deg);}
.m5{transform:rotate(225deg);}
.m6{transform:rotate(270deg);}
.m7{transform:rotate(315deg);}

.centerPointer{
position:absolute;
left:50%;
top:190px;
transform:translateX(-50%);
font-size:35px;
z-index:10;
}

.kaabaMarker{
position:absolute;
left:50%;
top:105px;

width:95px;
height:95px;

transform:translateX(-50%);

border-radius:50%;

background:#172a83;

border:
3px solid
rgba(255,255,255,.6);

display:flex;
align-items:center;
justify-content:center;

box-shadow:
0 0 20px rgba(0,0,0,.5);

z-index:8;
}

.kaaba{
font-size:55px;
}

.qiblaArrow{
position:absolute;
left:50%;
top:150px;

width:5px;
height:130px;

background:#19c3ef;

transform-origin:
bottom center;

transform:
translateX(-50%)
rotate(0deg);

z-index:6;

box-shadow:
0 0 10px #19c3ef;
}

.qiblaArrow:before{
content:"";

position:absolute;
top:-18px;
left:50%;

transform:
translateX(-50%);

border-left:
15px solid transparent;

border-right:
15px solid transparent;

border-bottom:
25px solid #19c3ef;
}

.distanceBox{
position:absolute;

top:315px;
left:50%;

transform:
translateX(-50%);

background:white;
color:#222;

padding:
11px 25px;

border-radius:10px;

font-size:20px;
font-weight:bold;

z-index:15;
}

.distanceBox:after{
content:"";

position:absolute;
bottom:-12px;
left:50%;

transform:
translateX(-50%);

border-left:
12px solid transparent;

border-right:
12px solid transparent;

border-top:
12px solid white;
}

.bottomCompass{
position:absolute;

bottom:20px;
left:50%;

transform:
translateX(-50%);

width:70px;
height:70px;

border-radius:50%;

border:
3px solid white;

background:#10286c;

display:flex;
align-items:center;
justify-content:center;

font-size:32px;

z-index:10;
}

#degree{
font-size:19px;
margin:10px;
}

#location{
font-size:14px;
margin:8px;
}

.status{
background:
rgba(0,0,0,.35);

padding:10px;

border-radius:10px;

max-width:450px;

margin:10px auto;
}

#result{
font-weight:bold;
margin:10px;
}

.warning{
font-size:13px;
color:#ffe082;

max-width:450px;

margin:10px auto;
}

</style>
</head>

<body>

<div class="header">

<h2>Sana Islamic</h2>

<div class="menu">⋮</div>

</div>


<div class="main">

<h1>🕋 Qibla Finder</h1>

<div class="info">
मोबाइल को सीधा रखकर क़िबला की दिशा खोजें।
</div>


<button
id="startBtn"
onclick="startQibla()">

📍 Find Qibla

</button>


<button
id="calibrateBtn"
onclick="calibrateCompass()">

🧭 Compass ठीक करें

</button>


<div class="qiblaBox">

<div class="stars">
✦　✧　⋆　✦　✧
</div>


<div
id="compassDial"
class="compassDial">

<div class="direction n">N</div>

<div class="direction s">S</div>

<div class="direction e">E</div>

<div class="direction w">W</div>


<div class="mark"></div>

<div class="mark m1"></div>

<div class="mark m2"></div>

<div class="mark m3"></div>

<div class="mark m4"></div>

<div class="mark m5"></div>

<div class="mark m6"></div>

<div class="mark m7"></div>

</div>


<div
id="qiblaArrow"
class="qiblaArrow">
</div>


<div class="kaabaMarker">

<div class="kaaba">
🕋
</div>

</div>


<div class="centerPointer">
▼
</div>


<div class="distanceBox">

<span id="distance">
-- km
</span>

</div>


<div class="bottomCompass">
🧭
</div>

</div>


<div id="degree">
🕋 क़िबला दिशा: --
</div>


<div id="location">
📍 स्थान: --
</div>


<div
id="status"
class="status">

Find Qibla दबाएँ।

</div>


<div id="result">
</div>


<div class="warning">

⚠️ सही दिशा के लिए मोबाइल में Compass Sensor होना जरूरी है।

</div>

</div>


<script>

/* =========================
   VARIABLES
========================= */

let qiblaBearing = 0;

let compassStarted = false;

let currentHeading = null;

let lastRawHeading = null;

let absoluteSensorWorking = false;

let fallbackTimer = null;


/* =========================
   START
========================= */

async function startQibla(){

document.getElementById("status").innerHTML =
"📍 आपका स्थान खोजा जा रहा है...";


if(!navigator.geolocation){

document.getElementById("status").innerHTML =
"❌ GPS उपलब्ध नहीं है।";

return;

}


navigator.geolocation.getCurrentPosition(

async function(position){

const lat =
position.coords.latitude;

const lon =
position.coords.longitude;


document.getElementById("location").innerHTML =
"📍 स्थान: "
+
lat.toFixed(4)
+
", "
+
lon.toFixed(4);


/* QIBLA */

qiblaBearing =
calculateQibla(
lat,
lon
);


document.getElementById("degree").innerHTML =
"🕋 क़िबला दिशा: "
+
qiblaBearing.toFixed(1)
+
"°";


/* DISTANCE */

const distance =
calculateDistance(
lat,
lon,
21.4225,
39.8262
);


document.getElementById("distance").innerHTML =
distance.toFixed(0)
+
" km";


document.getElementById("result").innerHTML =
"🕋 अब मोबाइल को धीरे-धीरे घुमाएँ।";


await enableCompass();

},

function(){

document.getElementById("status").innerHTML =
"❌ Location Permission Allow करें।";

},

{
enableHighAccuracy:true,
timeout:15000,
maximumAge:0
}

);

}


/* =========================
   QIBLA
========================= */

function calculateQibla(lat,lon){

const kaabaLat =
21.4225;

const kaabaLon =
39.8262;


const lat1 =
lat *
Math.PI /
180;

const lat2 =
kaabaLat *
Math.PI /
180;


const dLon =
(kaabaLon - lon)
*
Math.PI /
180;


const y =
Math.sin(dLon);


const x =
Math.cos(lat1)
*
Math.tan(lat2)
-
Math.sin(lat1)
*
Math.cos(dLon);


let bearing =
Math.atan2(y,x)
*
180 /
Math.PI;


bearing =
normalizeAngle(bearing);


return bearing;

}


/* =========================
   DISTANCE
========================= */

function calculateDistance(
lat1,
lon1,
lat2,
lon2
){

const R = 6371;


const dLat =
(lat2-lat1)
*
Math.PI /
180;


const dLon =
(lon2-lon1)
*
Math.PI /
180;


const a =
Math.sin(dLat/2)
*
Math.sin(dLat/2)

+

Math.cos(
lat1 *
Math.PI /
180
)

*

Math.cos(
lat2 *
Math.PI /
180
)

*

Math.sin(dLon/2)
*
Math.sin(dLon/2);


const c =
2 *
Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);


return R*c;

}


/* =========================
   NORMALIZE
========================= */

function normalizeAngle(angle){

angle =
angle % 360;


if(angle < 0){

angle += 360;

}


return angle;

}


/* =========================
   SHORTEST ANGLE
========================= */

function angleDifference(a,b){

let difference =
a-b;


while(difference > 180){

difference -= 360;

}


while(difference < -180){

difference += 360;

}


return difference;

}


/* =========================
   SMOOTH COMPASS
========================= */

function smoothHeading(
oldHeading,
newHeading
){

if(oldHeading === null){

return newHeading;

}


const difference =
angleDifference(
newHeading,
oldHeading
);


/*
   केवल थोड़ा-थोड़ा बदलाव
   इससे सुई कम हिलेगी
*/

return normalizeAngle(
oldHeading
+
difference *
0.15
);

}


/* =========================
   COMPASS
========================= */

async function enableCompass(){

if(compassStarted){

return;

}


/* iPhone */

if(
typeof DeviceOrientationEvent !== "undefined"
&&
typeof DeviceOrientationEvent.requestPermission === "function"
){

try{

const permission =
await DeviceOrientationEvent.requestPermission();


if(permission !== "granted"){

document.getElementById("status").innerHTML =
"❌ Compass Permission Allow नहीं हुई।";

return;

}

}
catch(error){

document.getElementById("status").innerHTML =
"❌ Compass शुरू नहीं हो सका।";

return;

}

}


/*
   पहले केवल ABSOLUTE COMPASS
   चलाएँगे।
*/

if(
typeof DeviceOrientationEvent !==
"undefined"
){

window.addEventListener(
"deviceorientationabsolute",
handleAbsoluteOrientation,
true
);


/*
   अगर 2 सेकंड में Absolute sensor
   से data नहीं आया तो fallback
*/

fallbackTimer =
setTimeout(function(){

if(!absoluteSensorWorking){

window.addEventListener(
"deviceorientation",
handleFallbackOrientation,
true
);

document.getElementById("status").innerHTML =
"🧭 सामान्य Compass चालू है।";

}

},2000);


compassStarted = true;


document.getElementById(
"calibrateBtn"
).style.display =
"inline-block";


document.getElementById("status").innerHTML =
"🧭 Compass चालू है।";

}
else{

document.getElementById("status").innerHTML =
"❌ इस मोबाइल में Compass उपलब्ध नहीं है।";

}

}


/* =========================
   ABSOLUTE SENSOR
========================= */

function handleAbsoluteOrientation(event){

if(
event.alpha === null ||
isNaN(event.alpha)
){

return;

}


/*
   Absolute sensor मिला
*/

absoluteSensorWorking = true;


/*
   Fallback को कभी शुरू नहीं करेंगे
*/

if(fallbackTimer){

clearTimeout(fallbackTimer);

fallbackTimer = null;

}


const heading =
normalizeAngle(
360 - event.alpha
);


updateCompass(heading);

}


/* =========================
   FALLBACK SENSOR
========================= */

function handleFallbackOrientation(event){

if(
event.alpha === null ||
isNaN(event.alpha)
){

return;

}


const heading =
normalizeAngle(
360 - event.alpha
);


updateCompass(heading);

}


/* =========================
   UPDATE COMPASS
========================= */

function updateCompass(rawHeading){

/*
   बहुत तेज jump को रोकना
*/

if(lastRawHeading !== null){

const jump =
Math.abs(
angleDifference(
rawHeading,
lastRawHeading
)
);


if(jump > 45){

return;

}

}


lastRawHeading =
rawHeading;


/*
   Smooth heading
*/

currentHeading =
smoothHeading(
currentHeading,
rawHeading
);


/*
   Compass घूमेगा
*/

document.getElementById(
"compassDial"
).style.transform =
"translateX(-50%) rotate("
+
(-currentHeading)
+
"deg)";


/*
   Qibla arrow
*/

let arrow =
angleDifference(
qiblaBearing,
currentHeading
);


document.getElementById(
"qiblaArrow"
).style.transform =
"translateX(-50%) rotate("
+
arrow
+
"deg)";


/*
   Status
*/

document.getElementById("status").innerHTML =
"🧭 Compass: "
+
currentHeading.toFixed(0)
+
"°";


/*
   Qibla accuracy
*/

const difference =
Math.abs(
angleDifference(
qiblaBearing,
currentHeading
)
);


if(difference <= 5){

document.getElementById("result").innerHTML =
"✅ 🕋 क़िबला की दिशा मिल गई।";

}

else if(difference <= 15){

document.getElementById("result").innerHTML =
"🕋 क़िबला के बहुत करीब हैं।";

}

else{

document.getElementById("result").innerHTML =
"🕋 नीले तीर को क़िबला की दिशा में रखें।";

}

}


/* =========================
   CALIBRATE
========================= */

function calibrateCompass(){

currentHeading = null;

lastRawHeading = null;

document.getElementById("status").innerHTML =
"🔄 मोबाइल को धीरे-धीरे 8 के आकार में घुमाएँ।";


setTimeout(function(){

document.getElementById("status").innerHTML =
"✅ Compass फिर से तैयार है।";

},5000);

}

</script>

</body>
</html>
