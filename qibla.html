<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sana Islamic - Qibla Finder</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#061743;
color:white;
text-align:center;
}

.header{
height:65px;
background:#4055b8;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
}

.header h2{
margin:0;
font-size:25px;
}

.menu{
font-size:30px;
}

.main{
min-height:calc(100vh - 65px);
padding:20px 10px 40px;
background:
radial-gradient(
circle at 50% 35%,
#178bd8 0%,
#17439e 38%,
#061743 90%
);
}

h1{
font-size:28px;
margin:10px 0;
}

.info{
font-size:16px;
margin-bottom:15px;
}

button{
border:0;
border-radius:10px;
padding:13px 22px;
margin:5px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

#startBtn{
background:white;
color:#222;
}

#calibrateBtn{
background:#12a9e0;
color:white;
display:none;
}

/* =========================
   QIBLA COMPASS
========================= */

.qiblaBox{
position:relative;
width:350px;
height:500px;
max-width:95vw;
margin:20px auto;
overflow:hidden;
border-radius:25px;

background:
linear-gradient(
to bottom,
#0b4394 0%,
#1684cf 52%,
#071b4f 53%,
#041337 100%
);

box-shadow:
0 0 30px rgba(0,0,0,.6);
}

/* Stars */

.stars{
position:absolute;
top:20px;
left:0;
width:100%;
font-size:22px;
opacity:.8;
z-index:1;
}

/* =========================
   ROTATING COMPASS
========================= */

.compassDial{
position:absolute;
width:310px;
height:310px;
left:50%;
top:35px;

transform:
translateX(-50%)
rotate(0deg);

border-radius:50%;

border:3px solid rgba(255,255,255,.7);

transition:
transform .15s linear;

z-index:3;
}

/* Compass Outer Circle */

.compassDial:before{
content:"";
position:absolute;
inset:15px;

border-radius:50%;

border:2px solid
rgba(255,255,255,.35);
}

/* Directions */

.direction{
position:absolute;
font-size:24px;
font-weight:bold;
}

.n{
top:8px;
left:50%;
transform:translateX(-50%);
}

.s{
bottom:8px;
left:50%;
transform:translateX(-50%);
}

.e{
right:10px;
top:50%;
transform:translateY(-50%);
}

.w{
left:10px;
top:50%;
transform:translateY(-50%);
}

/* Degree marks */

.mark{
position:absolute;
left:50%;
top:0;
width:2px;
height:15px;
background:white;
transform-origin:155px 155px;
}

.m1{
transform:rotate(45deg);
}

.m2{
transform:rotate(90deg);
}

.m3{
transform:rotate(135deg);
}

.m4{
transform:rotate(180deg);
}

.m5{
transform:rotate(225deg);
}

.m6{
transform:rotate(270deg);
}

.m7{
transform:rotate(315deg);
}


/* =========================
   FIXED CENTER POINTER
========================= */

.centerPointer{
position:absolute;
left:50%;
top:190px;
transform:translateX(-50%);
font-size:35px;
z-index:10;
}


/* =========================
   KAABA
========================= */

.kaabaMarker{
position:absolute;
left:50%;
top:105px;

width:95px;
height:95px;

transform:
translateX(-50%);

border-radius:50%;

background:#172a83;

border:
3px solid
rgba(255,255,255,.6);

display:flex;
align-items:center;
justify-content:center;

box-shadow:
0 0 20px rgba(0,0,0,.5);

z-index:8;
}

.kaaba{
font-size:55px;
}


/* =========================
   QIBLA ARROW
========================= */

.qiblaArrow{
position:absolute;

left:50%;

top:150px;

width:5px;

height:130px;

background:#19c3ef;

transform-origin:
bottom center;

transform:
translateX(-50%)
rotate(0deg);

z-index:6;

box-shadow:
0 0 10px #19c3ef;
}

.qiblaArrow:before{
content:"";

position:absolute;

top:-18px;

left:50%;

transform:
translateX(-50%);

border-left:
15px solid transparent;

border-right:
15px solid transparent;

border-bottom:
25px solid #19c3ef;
}


/* =========================
   DISTANCE
========================= */

.distanceBox{

position:absolute;

top:315px;

left:50%;

transform:
translateX(-50%);

background:white;

color:#222;

padding:
11px 25px;

border-radius:10px;

font-size:20px;

font-weight:bold;

z-index:15;

}

.distanceBox:after{

content:"";

position:absolute;

bottom:-12px;

left:50%;

transform:
translateX(-50%);

border-left:
12px solid transparent;

border-right:
12px solid transparent;

border-top:
12px solid white;

}


/* =========================
   BOTTOM COMPASS
========================= */

.bottomCompass{

position:absolute;

bottom:20px;

left:50%;

transform:
translateX(-50%);

width:70px;

height:70px;

border-radius:50%;

border:
3px solid white;

background:#10286c;

display:flex;

align-items:center;

justify-content:center;

font-size:32px;

z-index:10;

}


/* INFO */

#degree{

font-size:19px;

margin:10px;

}

#location{

font-size:14px;

margin:8px;

}

.status{

background:
rgba(0,0,0,.35);

padding:10px;

border-radius:10px;

max-width:450px;

margin:10px auto;

}

#result{

font-weight:bold;

margin:10px;

}

.warning{

font-size:13px;

color:#ffe082;

max-width:450px;

margin:10px auto;

}

</style>
</head>


<body>


<div class="header">

<h2>qibla</h2>

<div class="menu">⋮</div>

</div>


<div class="main">


<h1>🕋 Qibla Finder</h1>

<div class="info">

मोबाइल को घुमाकर Qibla की दिशा खोजें।

</div>


<button id="startBtn"
onclick="startQibla()">

📍 Find Qibla

</button>


<button id="calibrateBtn"
onclick="calibrateCompass()">

🧭 Calibrate

</button>



<div class="qiblaBox">


<div class="stars">

✦　✧　⋆　✦　✧

</div>


<!-- ROTATING COMPASS -->

<div id="compassDial"
class="compassDial">


<div class="direction n">N</div>

<div class="direction s">S</div>

<div class="direction e">E</div>

<div class="direction w">W</div>


<div class="mark"></div>

<div class="mark m1"></div>

<div class="mark m2"></div>

<div class="mark m3"></div>

<div class="mark m4"></div>

<div class="mark m5"></div>

<div class="mark m6"></div>

<div class="mark m7"></div>


</div>



<!-- QIBLA ARROW -->

<div id="qiblaArrow"
class="qiblaArrow">

</div>



<!-- KAABA -->

<div class="kaabaMarker">

<div class="kaaba">

🕋

</div>

</div>



<!-- CENTER POINTER -->

<div class="centerPointer">

▼

</div>



<!-- DISTANCE -->

<div class="distanceBox">

<span id="distance">

-- km

</span>

</div>



<!-- BOTTOM COMPASS -->

<div class="bottomCompass">

🧭

</div>


</div>



<div id="degree">

🕋 Qibla Direction: --

</div>


<div id="location">

📍 Location: --

</div>


<div id="status"
class="status">

Find Qibla दबाएँ।

</div>


<div id="result">

</div>


<div class="warning">

⚠️ Compass सही काम करने के लिए मोबाइल में Compass Sensor होना जरूरी है।

</div>


</div>



<script>


/* =========================
VARIABLES
========================= */

let qiblaBearing = 0;

let compassStarted = false;

let currentHeading = 0;



/* =========================
START
========================= */

async function startQibla(){


document.getElementById("status").innerHTML =

"📍 Location खोजी जा रही है...";


if(!navigator.geolocation){

alert(
"आपके Browser में GPS Support नहीं है।"
);

return;

}


navigator.geolocation.getCurrentPosition(

async function(position){


let lat =
position.coords.latitude;

let lon =
position.coords.longitude;



document.getElementById("location").innerHTML =

"📍 Location: "

+

lat.toFixed(4)

+

", "

+

lon.toFixed(4);



/* QIBLA */

qiblaBearing =

calculateQibla(

lat,

lon

);



document.getElementById("degree").innerHTML =

"🕋 Qibla Direction: "

+

qiblaBearing.toFixed(1)

+

"°";



/* DISTANCE */

let distance =

calculateDistance(

lat,

lon,

21.4225,

39.8262

);



document.getElementById("distance").innerHTML =

distance.toFixed(0)

+

" km";



document.getElementById("result").innerHTML =

"🕋 मोबाइल को धीरे-धीरे घुमाएँ।";



await enableCompass();


},

function(){

document.getElementById("status").innerHTML =

"❌ Location Permission Allow करें।";

},

{

enableHighAccuracy:true,

timeout:15000,

maximumAge:0

}

);

}



/* =========================
QIBLA
========================= */

function calculateQibla(lat,lon){


let kaabaLat =
21.4225;

let kaabaLon =
39.8262;


let lat1 =
lat *

Math.PI /

180;


let lat2 =
kaabaLat *

Math.PI /

180;


let dLon =

(kaabaLon-lon)

*

Math.PI /

180;


let y =
Math.sin(dLon);


let x =

Math.cos(lat1)

*

Math.tan(lat2)

-

Math.sin(lat1)

*

Math.cos(dLon);


let bearing =

Math.atan2(y,x)

*

180 /

Math.PI;


return (

bearing +

360

)

%

360;

}



/* =========================
DISTANCE
========================= */

function calculateDistance(

lat1,

lon1,

lat2,

lon2

){


let R =
6371;


let dLat =

(lat2-lat1)

*

Math.PI /

180;


let dLon =

(lon2-lon1)

*

Math.PI /

180;


let a =

Math.sin(dLat/2)

*

Math.sin(dLat/2)

+

Math.cos(

lat1 *

Math.PI /

180

)

*

Math.cos(

lat2 *

Math.PI /

180

)

*

Math.sin(dLon/2)

*

Math.sin(dLon/2);


let c =

2 *

Math.atan2(

Math.sqrt(a),

Math.sqrt(1-a)

);


return R*c;

}



/* =========================
COMPASS
========================= */

async function enableCompass(){


if(compassStarted){

return;

}


/* iPhone */

if(

typeof DeviceOrientationEvent !==

"undefined"

&&

typeof DeviceOrientationEvent.requestPermission ===

"function"

){


try{


let permission =

await DeviceOrientationEvent.requestPermission();


if(permission !== "granted"){

document.getElementById("status").innerHTML =

"❌ Compass Permission Allow नहीं हुई।";

return;

}

}

catch(e){

return;

}

}



/* SENSOR */

if(

typeof DeviceOrientationEvent !==

"undefined"

){


window.addEventListener(

"deviceorientationabsolute",

handleOrientation,

true

);


window.addEventListener(

"deviceorientation",

handleOrientation,

true

);


compassStarted = true;


document.getElementById(

"calibrateBtn"

).style.display =

"inline-block";


document.getElementById("status").innerHTML =

"🧭 Compass चालू है। मोबाइल घुमाएँ।";

}

else{


document.getElementById("status").innerHTML =

"❌ Compass Support नहीं है।";

}

}



/* =========================
ORIENTATION
========================= */

function handleOrientation(event){


let heading = null;


/* iPhone */

if(

event.webkitCompassHeading !==

undefined

&&

event.webkitCompassHeading !==

null

){


heading =

event.webkitCompassHeading;

}


/* Android */

else if(

event.alpha !== null

){


heading =

360 -

event.alpha;

}


if(heading === null){

return;

}


heading =

(

heading +

360

)

%

360;


currentHeading =

heading;



/* ROTATE COMPASS */

document.getElementById(

"compassDial"

).style.transform =

"translateX(-50%) rotate("

+

(-heading)

+

"deg)";



/* QIBLA ARROW */

let arrowRotation =

qiblaBearing -

heading;


document.getElementById(

"qiblaArrow"

).style.transform =

"translateX(-50%) rotate("

+

arrowRotation

+

"deg)";



document.getElementById("status").innerHTML =

"🧭 Compass: "

+

heading.toFixed(0)

+

"°";

}



/* =========================
CALIBRATE
========================= */

function calibrateCompass(){


document.getElementById("status").innerHTML =

"🔄 मोबाइल को धीरे-धीरे 8 के आकार में घुमाएँ।";


setTimeout(function(){


document.getElementById("status").innerHTML =

"✅ Calibration पूरी। अब Qibla दिशा देखें।";


},5000);

}

</script>

</body>

</html>
