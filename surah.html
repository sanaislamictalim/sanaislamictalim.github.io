function normalize(text) {
    return String(text)
        .toLowerCase()
        .replace(/[أإآٱ]/g, "ا")
        .replace(/[ًٌٍَُِّْٰـ]/g, "")
        .replace(/[\u093c\u093e-\u094c\u0951-\u0957]/g, "")
        .replace(/[\s\-_'’]/g, "");
}

function convertHindiNumber(value) {
    return value.replace(/[०-९]/g, digit =>
        "०१२३४५६७८९".indexOf(digit)
    );
}

function searchSurah() {
    const input = document.getElementById("search").value.trim();
    const result = document.getElementById("result");

    if (!input) {
        result.innerHTML = "";
        return;
    }

    const query = normalize(convertHindiNumber(input));

    const matches = surahs.filter(surah =>
        normalize(surah[0]).includes(query) ||
        normalize(surah[1]).includes(query) ||
        String(surah[2]) === query
    );

    if (!matches.length) {
        result.innerHTML =
            '<div class="message">कोई सूरह नहीं मिली। नाम या नंबर जाँचें।</div>';
        return;
    }

    result.innerHTML = matches.map(surah => `
        <div class="card">
            <span class="number">सूरह नंबर ${surah[2]}</span>
            <div class="name">${surah[0]}</div>
            <div class="arabic">${surah[1]}</div>
            <div>पारा: ${surah[3]}</div>
            <a href="para${surah[3]}.html?surah=${encodeURIComponent(surah[0])}">
                📖 पारा ${surah[3]} खोलें
            </a>
        </div>
    `).join("");
}

document.getElementById("search").addEventListener("input", searchSurah);
