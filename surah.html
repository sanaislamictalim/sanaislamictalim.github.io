function normalize(value) {
    return String(value)
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[़ًٌٍَُِّْٰـ]/g, "")
        .replace(/[أإآٱ]/g, "ا")
        .replace(/[يى]/g, "ي")
        .replace(/[ؤ]/g, "و")
        .replace(/[ئ]/g, "ي")
        .replace(/[^a-z0-9\u0900-\u097f\u0600-\u06ff]/g, "");
}

function convertDigits(value) {
    return String(value)
        .replace(/[०-९]/g, d => "०१२३४५६७८९".indexOf(d))
        .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
}

function searchSurahs() {
    const input = document.getElementById("searchInput").value.trim();
    const list = document.getElementById("surahList");
    const info = document.getElementById("resultInfo");

    if (!input) {
        list.innerHTML = "";
        info.textContent = "कुल 114 सूरह";
        return;
    }

    const query = normalize(convertDigits(input));

    const results = surahs.filter(surah => {
        const hindi = normalize(surah[0]);
        const english = normalize(surah[1]);
        const arabic = normalize(surah[2]);
        const number = String(surah[3]);

        return (
            hindi.includes(query) ||
            english.includes(query) ||
            arabic.includes(query) ||
            number === query
        );
    });

    if (results.length === 0) {
        list.innerHTML = `
            <div class="no-result">
                ❌ कोई सूरह नहीं मिली। दूसरा नाम या नंबर लिखें।
            </div>
        `;
        info.textContent = "कोई परिणाम नहीं";
        return;
    }

    info.textContent = `✅ ${results.length} सूरह मिली`;

    list.innerHTML = results.map(surah => `
        <div class="card">
            <span class="number">सूरह नंबर ${surah[3]}</span>
            <div class="name">${surah[0]}</div>
            <div class="english">${surah[1]}</div>
            <div class="arabic" lang="ar">${surah[2]}</div>
            <div class="para">📚 संबंधित पारा: ${surah[4]}</div>
            <a class="read-btn"
               href="para${surah[4]}.html?surah=${encodeURIComponent(surah[0])}">
               📖 पारा ${surah[4]} खोलें
            </a>
        </div>
    `).join("");
}

    .addEventListener("input", searchSurahs);
