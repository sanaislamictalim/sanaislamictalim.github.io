/* ================================
   SEARCH TEXT NORMALIZE
================================ */

function normalizeText(text){

    return String(text)
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/़/g,"")
        .replace(/[َُِّْٰـ]/g,"")
        .replace(/\s+/g,"")
        .replace(/[-_]/g,"");

}


/* ================================
   SURAH SHOW
================================ */

function showSurahs(list){

    const box = document.getElementById("surahList");

    if(list.length === 0){

        box.innerHTML = `
        <div class="no-result">
            ❌ कोई सूरह नहीं मिली
        </div>
        `;

        return;
    }


    box.innerHTML = list.map(surah => {

        let paraButtons = "";

        surah.paras.forEach(item => {

            paraButtons += `
            <a
                class="read-btn"
                href="para${item.para}.html?surah=${surah.name}"
            >
                📖 पारा ${item.para}
            </a>
            `;

        });


        return `
        <div class="surah-card">

            <div class="surah-number">
                सूरह नंबर ${surah.number}
            </div>

            <div class="surah-name">
                ${surah.name}
            </div>

            <div class="surah-arabic">
                ${surah.arabic}
            </div>

            <div class="ayat">
                कुल आयत: ${surah.ayat}
            </div>
<div class="surah-type">
    📍 ${surahType[surah.number]}
</div>
            <div class="para-title">
                📚 इस सूरह के पारे:
            </div>

            <div class="para-buttons">
                ${paraButtons}
            </div>

        </div>
        `;

    }).join("");

}


/* ================================
   SEARCH
================================ */

function searchSurah(){

    const query =
        normalizeText(
            document.getElementById("searchInput").value
        );

    const resultInfo =
        document.getElementById("resultInfo");


    if(query === ""){

        showSurahs(surahs);

        resultInfo.textContent =
            "कुल 114 सूरह";

        return;
    }


    const filtered = surahs.filter(surah => {

        const name =
            normalizeText(surah.name);

        const arabic =
            normalizeText(surah.arabic);

        return (
            name.includes(query) ||
            arabic.includes(query) ||
            String(surah.number) === query
        );

    });


    showSurahs(filtered);


    if(filtered.length){

        resultInfo.textContent =
            `✅ ${filtered.length} सूरह मिली`;

    }else{

        resultInfo.textContent =
            "❌ कोई सूरह नहीं मिली";

    }

}


/* ================================
   SEARCH INPUT
================================ */

document
.getElementById("searchInput")
.addEventListener("input",searchSurah);


/* ================================
   FIRST DISPLAY
================================ */

showSurahs(surahs);

document
.getElementById("resultInfo")
.textContent="कुल 114 सूरह";

</script>
