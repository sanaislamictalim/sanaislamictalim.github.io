/* =====================================================
   NORMALIZE
===================================================== */

function normalize(text){

    return text
    .trim()
    .toLowerCase()
    .replace(/[؟?!.,،]/g,"")
    .replace(/\s+/g," ");

}


/* =====================================================
   ANSWER CHECK
===================================================== */

function checkAnswer(id, correctAnswer){

    const input =
        document.getElementById(id);

    const result =
        document.getElementById("result-"+id);

    if(!input || !result){
        return;
    }

    const userAnswer =
        normalize(input.value);

    if(userAnswer === ""){

        result.innerHTML =
        "⚠️ पहले अपना जवाब लिखें।";

        result.className="result wrong";

        return;
    }

    const correct =
        normalize(correctAnswer);

    let isCorrect=false;


    /* NUMBER */

    if(correct==="6"){

        isCorrect =
        userAnswer==="6" ||
        userAnswer==="६" ||
        userAnswer.includes("छह") ||
        userAnswer.includes("छः") ||
        userAnswer.includes("چھ");
    }


    else if(correct==="5"){

        isCorrect =
        userAnswer==="5" ||
        userAnswer==="५" ||
        userAnswer.includes("पांच") ||
        userAnswer.includes("पाँच") ||
        userAnswer.includes("پانچ");
    }


    else if(correct==="4"){

        isCorrect =
        userAnswer==="4" ||
        userAnswer==="४" ||
        userAnswer.includes("चार") ||
        userAnswer.includes("چار");
    }


    /* YES */

    else if(correct==="हाँ"){

        isCorrect =
        userAnswer.includes("हाँ") ||
        userAnswer.includes("हां") ||
        userAnswer==="हा" ||
        userAnswer==="yes" ||
        userAnswer.includes("جی") ||
        userAnswer.includes("ہاں");
    }


    /* NO */

    else if(correct==="नहीं"){

        isCorrect =
        userAnswer.includes("नहीं") ||
        userAnswer.includes("नही") ||
        userAnswer==="no" ||
        userAnswer.includes("نہیں");
    }


    /* NORMAL WORD */

    else{

        isCorrect =
        userAnswer.includes(correct);

        /* कुछ alternate spellings */

        if(correct==="अल्लाह"){
            isCorrect =
            userAnswer.includes("अल्लाह") ||
            userAnswer.includes("allah") ||
            userAnswer.includes("اللہ");
        }

        if(correct==="मुहम्मद"){
            isCorrect =
            userAnswer.includes("मुहम्मद") ||
            userAnswer.includes("मोहम्मद") ||
            userAnswer.includes("muhammad") ||
            userAnswer.includes("محمد");
        }

        if(correct==="जिब्रील"){
            isCorrect =
            userAnswer.includes("जिब्रील") ||
            userAnswer.includes("जिब्रईल") ||
            userAnswer.includes("jibreel") ||
            userAnswer.includes("جبرئیل") ||
            userAnswer.includes("جبریل");
        }

        if(correct==="इसराफ़ील"){
            isCorrect =
            userAnswer.includes("इसराफ़ील") ||
            userAnswer.includes("इसराफील") ||
            userAnswer.includes("israfeel") ||
            userAnswer.includes("اسرافیل");
        }

        if(correct==="मूसा"){
            isCorrect =
            userAnswer.includes("मूसा") ||
            userAnswer.includes("musa") ||
            userAnswer.includes("موسی");
        }

        if(correct==="दाऊद"){
            isCorrect =
            userAnswer.includes("दाऊद") ||
            userAnswer.includes("दावूद") ||
            userAnswer.includes("dawud") ||
            userAnswer.includes("dawood") ||
            userAnswer.includes("داود");
        }

    }


    if(isCorrect){

        result.innerHTML =
        "✅ सही जवाब! माशाअल्लाह।";

        result.className="result correct";

    }
    else{

        result.innerHTML =
        "❌ जवाब सही नहीं है। दोबारा कोशिश करें।";

        result.className="result wrong";

    }

}

lessons.forEach((lesson,lessonIndex)=>{

    const lessonNumber =
        lessonIndex+1;

    let html=`

    <div class="card">

            सबक ${lessonNumber}: ${lesson.title}

            <br>

            <span class="urdu">

        </h2>

        <h3>हिंदी:</h3>

        <p>
            ${lesson.text}
        </p>

        <h3 class="urdu">اردو:</h3>

        <p class="urdu">
            ${lesson.text}
        </p>

    </div>


    <div class="card">

        <h2>
            ❓ सबक ${lessonNumber} के सवाल
            <br>
            <span class="urdu">
                ❓ سبق ${lessonNumber} کے سوالات
            </span>
        </h2>
    `;


    lesson.questions.forEach((question,qIndex)=>{

        const questionNumber =
            qIndex+1;

        const id =
            "l"+lessonNumber+"q"+questionNumber;

        html += `

        <div class="question">

            <b>
                सवाल ${questionNumber}:
            </b>

            ${question[0]}

            <p class="urdu">
                سوال ${questionNumber}
            </p>

            <input
                type="text"
                id="${id}"
                class="answer-box"
                placeholder="अपना जवाब लिखें / اپنا جواب لکھیں"
            >

            <button
                type="button"
                class="check-btn"
                onclick="checkAnswer(
                    '${id}',
                    '${question[1].replace(/'/g,"\\'")}'
                )"
            >
                जवाब जांचें
            </button>

            <p
                id="result-${id}"
                class="result"
            ></p>

        </div>

        `;

    });


    html += `</div>`;

    lessonContainer.innerHTML += html;

});
