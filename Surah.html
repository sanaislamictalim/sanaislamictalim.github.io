/*
====================================================
SURAH LIST DISPLAY
====================================================
*/

const surahList = document.getElementById("surahList");
const searchInput = document.getElementById("searchInput");
const resultInfo = document.getElementById("resultInfo");


function showSurahs(list){

    surahList.innerHTML = "";

    if(list.length === 0){

        surahList.innerHTML = `
            <div class="no-result">
                ❌ कोई सूरह नहीं मिली।
            </div>
        `;

        resultInfo.textContent = "कोई परिणाम नहीं मिला";
        return;
    }

    resultInfo.textContent =
        list.length + " सूरह मिलीं";

    list.forEach(surah => {

        let paraHTML = "";

        surah.paras.forEach(item => {

            paraHTML += `
                <div class="para-row">

                    <div class="para-range">
                        <b>पारा ${item.para}</b>
                        — आयत ${item.from}–${item.to}
                    </div>

                    <a
                        class="read-btn"
                        href="para${item.para}.html"
                    >
                        📖 पढ़ें
                    </a>

                </div>
            `;

        });


        const card = document.createElement("div");

        card.className = "surah-card";

        card.innerHTML = `

            <div class="surah-top">

                <div class="surah-number">
                    ${surah.number}
                </div>

                <div class="surah-name">

                    <h2>
                        ${surah.name}
                    </h2>

                    <p>
                        ${surah.ayat} आयत
                    </p>

                </div>

                <div class="arabic-name">
                    ${surah.arabic}
                </div>

            </div>

            <div class="para-info">

                <div class="para-title">
                    📚 संबंधित पारा
                </div>

                ${paraHTML}

            </div>
        `;

        surahList.appendChild(card);

    });

}


/*
====================================================
SEARCH
====================================================
*/

searchInput.addEventListener("input", function(){

    const query =
        this.value.trim().toLowerCase();

    if(query === ""){

        showSurahs(surahs);
        return;

    }

    const filtered =
        surahs.filter(surah => {

            return (
                surah.name.toLowerCase().includes(query) ||
                surah.arabic.includes(query) ||
                String(surah.number) === query
            );

        });

    showSurahs(filtered);

});


/*
====================================================
FIRST LOAD
====================================================
*/

showSurahs(surahs);

</script>
