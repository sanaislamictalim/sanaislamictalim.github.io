<!DOCTYPE html><html lang="hi"><head>
    <meta charset="UTF-8"><meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>इस्लामी अख़लाक़ और आदाब | Islamic Akhlaq & Adab</title>

<meta name="description"
      content="इस्लामी अख़लाक़ और आदाब की आसान जानकारी, कुरआन और सहीह हदीस की रोशनी में। Hindi और Urdu में।">

<meta name="keywords"
      content="Islamic Akhlaq, Adab, Akhlaq in Islam, Islami Akhlaq, Islami Adab, Hindi Urdu Islamic">

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, "Noto Sans Devanagari", sans-serif;
        background: #eefaf0;
        color: #c40000;
        line-height: 1.8;
    }

    .container {
        max-width: 1100px;
        margin: auto;
        padding: 20px;
    }

    .main-title {
        text-align: center;
        background: linear-gradient(145deg, #16833a, #0d6b2d);
        color: white;
        padding: 25px 15px;
        border-radius: 18px;
        margin-bottom: 25px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    .main-title h1 {
        font-size: 30px;
        margin-bottom: 8px;
    }

    .main-title p {
        font-size: 17px;
    }

    .urdu-title {
        direction: rtl;
        font-family: "Noto Naskh Arabic", "Amiri", serif;
        margin-top: 8px;
    }

    .akhlaq-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
    }

    .akhlaq-card {
        background: linear-gradient(145deg, #d9f5df, #bdebc8);
        border: 2px solid #16833a;
        border-radius: 16px;
        padding: 22px;
        box-shadow: 0 5px 14px rgba(0,0,0,0.12);
        color: #c40000;
        transition: 0.3s;
    }

    .akhlaq-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 9px 20px rgba(0,0,0,0.18);
    }

    .akhlaq-number {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: white;
        border: 2px solid #d00000;
        color: #d00000;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        margin-bottom: 12px;
    }

    .akhlaq-card h2 {
        color: #b00000;
        font-size: 21px;
        margin-bottom: 12px;
    }

    .akhlaq-card p,
    .akhlaq-card li {
        color: #c40000;
        font-size: 16px;
        line-height: 1.8;
    }

    .quran-box {
        background: white;
        padding: 15px;
        border-radius: 12px;
        margin-top: 12px;
        border-left: 5px solid #16833a;
    }

    .arabic {
        direction: rtl;
        text-align: right;
        font-size: 25px;
        line-height: 2;
        color: #a80000;
        font-family: "Noto Naskh Arabic", "Amiri", serif;
    }

    .urdu {
        direction: rtl;
        text-align: right;
        color: #a80000;
        font-size: 18px;
        line-height: 1.9;
        margin-top: 8px;
    }

    .tafseer {
        background: #ffffff;
        border-radius: 10px;
        padding: 12px;
        margin-top: 12px;
    }

    .source {
        color: #555 !important;
        font-size: 14px !important;
        margin-top: 10px;
    }

    .important {
        background: #fff3f3;
        border: 2px solid #d00000;
    }

    .footer {
        text-align: center;
        background: #16833a;
        color: white;
        padding: 20px;
        margin-top: 30px;
        border-radius: 15px;
    }

    @media (max-width: 750px) {

        .akhlaq-grid {
            grid-template-columns: 1fr;
        }

        .container {
            padding: 12px;
        }

        .akhlaq-card {
            padding: 18px;
        }

        .main-title h1 {
            font-size: 25px;
        }

        .arabic {
            font-size: 22px;
        }
    }
</style>

</head><body><div class="container"><header class="main-title">

    <h1>
        इस्लामी अख़लाक़ और आदाब
    </h1>

    <p>
        Qur'an और सहीह हदीस की रोशनी में
    </p>

    <div class="urdu-title">
        اسلامی اخلاق و آداب
    </div>

</header>


<!-- यहाँ से Part 1 के Cards शुरू होंगे -->

<div class="akhlaq-grid">

    <!-- आपका Card 1 यहाँ -->
    <!-- आपका Card 2 यहाँ -->

</div>


<footer class="footer">

    <p>
        इस्लामी अख़लाक़ और आदाब
    </p>

    <p>
        Qur'an और Sunnah की रोशनी में
    </p>

</footer>

</div></body>
</html>
