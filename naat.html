<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naat Audio</title>
</head>
<body>

    <audio controls>
        <source src="naat-audio/naat1.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio> 
    <audio controls>
<source src="naat-audio/naat2.mp3" type="audio/mpeg">
 </audio>





<div>
<script>
const audios = document.querySelectorAll("audio");

audios.forEach((audio, index) => {
    audio.addEventListener("ended", function () {
        if (index + 1 < audios.length) {
            audios[index + 1].play();
        }
    });
});
</script>



</body>
</html>
