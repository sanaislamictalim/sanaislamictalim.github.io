<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donate - Sana Islamic</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#036cf5;
    font-family:Arial,sans-serif;
    text-align:center;
}

.container{
    max-width:420px;
    margin:auto;
    background:#ece006;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}

h1{color:#0d8f4d;}

#amount{
    color:#e53935;
    font-size:24px;
    font-weight:bold;
}

img{
    width:250px;
    border-radius:10px;
    margin:15px 0;
}

input{
    width:100%;
    padding:12px;
    font-size:18px;
    text-align:center;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:none;
    border-radius:8px;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.copy-btn{background:#2196F3;}
.gpay{background:#0F9D58;}
.phonepe{background:#5f259f;}
.paytm{background:#00baf2;}
.other{background:#ff9800;}
</style>
</head>

<body>

<div class="container">

<h1>🤲 Donate</h1>

<h2 id="amount">दान करें</h2>

<img src="qr.jpg" alt="QR Code">

<h3>UPI ID</h3>

<input id="upid" value="8541849708@axl" readonly>

<button class="copy-btn" onclick="copyUPI()">
📋 Copy UPI ID
</button>

<button class="gpay" onclick="pay()">
🟢 Google Pay
</button>

<button class="phonepe" onclick="pay()">
🟣 PhonePe
</button>

<button class="paytm" onclick="pay()">
💙 Paytm
</button>

<button class="other" onclick="pay()">
🏦 Other UPI
</button>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const amount = params.get("amount") || "";

document.getElementById("amount").innerText =
amount
? "आप ₹" + amount + " दान कर रहे हैं"
: "दान करें";

function copyUPI(){

    navigator.clipboard.writeText("8541849708@axl")
    .then(function(){
        alert("UPI ID Copy हो गई ✅");
    })
    .catch(function(){
        alert("UPI ID: 8541849708@axl");
    });

}

function pay(){

    if(!amount){
        alert("कृपया पहले Donation Amount चुनें।");
        return;
    }

    const upi =
    "upi://pay" +
    "?pa=8541849708@axl" +
    "&pn=ROKSANA%20KHATOON" +
    "&am=" + encodeURIComponent(amount) +
    "&cu=INR";

    window.location.href = upi;

}

</script>

</body>
</html>
