<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sana Islamic - Islamic Calendar</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#061743;
color:white;
}

.header{
background:#4055b8;
padding:12px 10px;
text-align:center;
}

.header h2{
margin:0;
font-size:24px;
}

#clock{
font-size:20px;
font-weight:bold;
margin-top:5px;
}

.main{
min-height:100vh;
padding:15px 8px 35px;

background:
radial-gradient(
circle at 50% 20%,
#178bd8 0%,
#17439e 40%,
#061743 90%
);
}

.title{
text-align:center;
font-size:25px;
font-weight:bold;
margin:8px 0 15px;
}

.monthBox{
max-width:600px;
margin:auto;

background:rgba(0,0,0,.25);

padding:10px;

border-radius:15px;
}

.monthTitle{
text-align:center;
font-size:20px;
font-weight:bold;
margin-bottom:10px;
line-height:28px;
}

.buttons{
display:flex;
gap:6px;
margin-bottom:10px;
}

.buttons button{
flex:1;
border:0;
border-radius:10px;
padding:10px 5px;

font-size:15px;
font-weight:bold;

background:#12a9e0;
color:white;
}

.todayBtn{
background:white !important;
color:#222 !important;
}

.calendar{
width:100%;
border-collapse:collapse;
table-layout:fixed;
}

.calendar th{
background:#4055b8;
color:white;

padding:8px 2px;

font-size:12px;
line-height:18px;
}

.calendar td{
height:88px;

border:2px solid #061743;

background:#f5f5f5;

color:#111;

vertical-align:top;

padding:4px 2px;

position:relative;
}

.calendar td.today{
background:#ffe082;
}

.calendar td.holiday{
background:#b7f7c5;
}

.dateEnglish{
font-size:20px;
font-weight:bold;
}

.dateHindi{
font-size:12px;
font-weight:bold;
margin-top:2px;
}

.dateUrdu{
font-size:12px;
direction:rtl;
margin-top:3px;
}

.hijri{
font-size:10px;
color:#17439e;
font-weight:bold;
margin-top:4px;
line-height:13px;
}

.tick{
font-size:17px;
font-weight:bold;
color:green;
margin-top:2px;
}

.holidayName{
font-size:8px;
font-weight:bold;
color:#075c16;
line-height:10px;
margin-top:1px;
}

.info{
max-width:600px;
margin:15px auto 0;

background:#06edf9;

color:#111;

border:2px solid green;

border-radius:10px;

padding:10px;

text-align:center;

font-weight:bold;

line-height:25px;
}

.footerNote{
max-width:600px;

margin:12px auto;

font-size:12px;

text-align:center;

color:#ffe082;
}

</style>
</head>


<body>


<div class="header">

<h2>🕌 Sana Islamic</h2>

<div id="clock">
🕒 --:--:--
</div>

</div>


<div class="main">


<div class="title">
📅 इस्लामिक कैलेंडर
</div>


<div class="monthBox">


<div id="monthTitle"
class="monthTitle">

Loading...

</div>


<div class="buttons">

<button onclick="previousMonth()">
⬅ पिछला
</button>

<button
class="todayBtn"
onclick="goToday()">

आज

</button>

<button onclick="nextMonth()">
अगला ➡
</button>

</div>


<table class="calendar">


<thead>

<tr>

<th>
रवि<br>
اتوار
</th>

<th>
सोम<br>
پیر
</th>

<th>
मंगल<br>
منگل
</th>

<th>
बुध<br>
بدھ
</th>

<th>
गुरु<br>
جمعرات
</th>

<th>
शुक्र<br>
جمعہ
</th>

<th>
शनि<br>
ہفتہ
</th>

</tr>

</thead>


<tbody id="calendarBody">
</tbody>


</table>


</div>


<div id="info"
class="info">

आज की तारीख लोड हो रही है...

</div>


<div class="footerNote">

🌙 Hijri तारीख गणनात्मक है।
चाँद देखने के अनुसार स्थानीय रूप से
1 दिन आगे या पीछे हो सकती है।

</div>


</div>


<script>


/* =========================
   MONTH NAMES
========================= */

const monthNamesHindi = [

"जनवरी",
"फ़रवरी",
"मार्च",
"अप्रैल",
"मई",
"जून",
"जुलाई",
"अगस्त",
"सितंबर",
"अक्टूबर",
"नवंबर",
"दिसंबर"

];


const monthNamesEnglish = [

"January",
"February",
"March",
"April",
"May",
"June",
"July",
"August",
"September",
"October",
"November",
"December"

];


const monthNamesUrdu = [

"جنوری",
"فروری",
"مارچ",
"اپریل",
"مئی",
"جون",
"جولائی",
"اگست",
"ستمبر",
"اکتوبر",
"نومبر",
"دسمبر"

];


const hindiDays = [

"रवि",
"सोम",
"मंगल",
"बुध",
"गुरु",
"शुक्र",
"शनि"

];


const urduDays = [

"اتوار",
"پیر",
"منگل",
"بدھ",
"جمعرات",
"جمعہ",
"ہفتہ"

];


/* =========================
   HIJRI MONTH
========================= */

const hijriMonthsHindi = [

"मुहर्रम",
"सफ़र",
"रबीउल अव्वल",
"रबीउल आखिर",
"जुमादाल ऊला",
"जुमादाल आखिरा",
"रजब",
"शाबान",
"रमज़ान",
"शव्वाल",
"ज़िलक़ादा",
"ज़िलहिज्जा"

];


const hijriMonthsUrdu = [

"مُحَرَّم",
"صَفَر",
"رَبِيعُ الْأَوَّل",
"رَبِيعُ الآخِر",
"جُمَادَى الْأُولَى",
"جُمَادَى الْآخِرَة",
"رَجَب",
"شَعْبَان",
"رَمَضَان",
"شَوَّال",
"ذُو الْقَعْدَة",
"ذُو الْحِجَّة"

];


/* =========================
   ISLAMIC EVENTS
========================= */

const islamicEvents = {

"1-1":
"इस्लामी नया साल",

"10-1":
"आशूरा",

"12-3":
"ईद-ए-मिलादुन्नबी ﷺ",

"27-7":
"शब-ए-मेराज",

"15-8":
"शब-ए-बरात",

"1-9":
"रमज़ान",

"27-9":
"शब-ए-क़द्र",

"1-10":
"ईद-उल-फ़ित्र",

"9-12":
"अरफ़ा",

"10-12":
"ईद-उल-अज़हा"

};


/* =========================
   CURRENT VIEW
========================= */

let viewDate = new Date();


/* =========================
   LIVE CLOCK
========================= */

function updateClock(){

const now = new Date();

const time =
now.toLocaleTimeString(
"en-IN",
{
hour:"2-digit",
minute:"2-digit",
second:"2-digit",
hour12:true
}
);

document.getElementById("clock").innerHTML =
"🕒 " + time;

}

updateClock();

setInterval(
updateClock,
1000
);


/* =========================
   HIJRI DATE
   IMPORTANT:
   islamic-umalqura
========================= */

function getHijri(date){

try{

const formatter =
new Intl.DateTimeFormat(
"en-IN-u-ca-islamic-umalqura",
{
day:"numeric",
month:"numeric",
year:"numeric"
}
);


const parts =
formatter.formatToParts(date);


let day = 0;
let month = 0;
let year = 0;


parts.forEach(function(part){

if(part.type === "day"){

day =
parseInt(part.value);

}

if(part.type === "month"){

month =
parseInt(part.value);

}

if(part.type === "year"){

year =
parseInt(part.value);

}

});


return {

day:day,
month:month,
year:year

};


}

catch(error){

/*
 अगर किसी पुराने browser में
 Umm Al-Qura उपलब्ध नहीं है
*/

const formatter =
new Intl.DateTimeFormat(
"en-IN-u-ca-islamic",
{
day:"numeric",
month:"numeric",
year:"numeric"
}
);


const parts =
formatter.formatToParts(date);


let day = 0;
let month = 0;
let year = 0;


parts.forEach(function(part){

if(part.type === "day")
day = parseInt(part.value);

if(part.type === "month")
month = parseInt(part.value);

if(part.type === "year")
year = parseInt(part.value);

});


return {

day:day,
month:month,
year:year

};

}

}


/* =========================
   CREATE CALENDAR
========================= */

function createCalendar(){

const year =
viewDate.getFullYear();

const month =
viewDate.getMonth();


document.getElementById(
"monthTitle"
).innerHTML =

"📅 "
+
monthNamesHindi[month]
+
" "
+
year
+
"<br>"
+
monthNamesEnglish[month]
+
" | "
+
monthNamesUrdu[month];


const firstDay =
new Date(
year,
month,
1
).getDay();


const totalDays =
new Date(
year,
month + 1,
0
).getDate();


const tbody =
document.getElementById(
"calendarBody"
);


tbody.innerHTML = "";


let row =
document.createElement("tr");


/* EMPTY CELLS */

for(
let i=0;
i<firstDay;
i++
){

const cell =
document.createElement("td");

row.appendChild(cell);

}


/* ALL DATES */

for(
let day=1;
day<=totalDays;
day++
){

const date =
new Date(
year,
month,
day
);


const cell =
document.createElement("td");


/* TODAY */

const today =
new Date();


if(

date.getFullYear() ===
today.getFullYear()

&&

date.getMonth() ===
today.getMonth()

&&

date.getDate() ===
today.getDate()

){

cell.classList.add("today");

}


/* HIJRI */

const hijri =
getHijri(date);


const key =
hijri.month
+
"-"
+
hijri.day;


const eventName =
islamicEvents[key];


if(eventName){

cell.classList.add(
"holiday"
);

}


/* HTML */

let html = "";


html +=
'<div class="dateEnglish">'
+
day
+
"</div>";


html +=
'<div class="dateHindi">'
+
hindiDays[
date.getDay()
]
+
"</div>";


html +=
'<div class="dateUrdu">'
+
urduDays[
date.getDay()
]
+
"</div>";


if(
hijri.day > 0
&&
hijri.month > 0
){

html +=
'<div class="hijri">'
+
hijri.day
+
" "
+
hijriMonthsHindi[
hijri.month - 1
]
+
"<br>"
+
hijriMonthsUrdu[
hijri.month - 1
]
+
"</div>";

}


if(eventName){

html +=
'<div class="tick">✓</div>';

html +=
'<div class="holidayName">'
+
eventName
+
"</div>";

}


cell.innerHTML =
html;


row.appendChild(cell);


/* NEW ROW */

if(
date.getDay() === 6
){

tbody.appendChild(row);

row =
document.createElement("tr");

}

}


/* LAST ROW */

if(
row.children.length > 0
){

while(
row.children.length < 7
){

const empty =
document.createElement("td");

row.appendChild(empty);

}

tbody.appendChild(row);

}


/* TODAY INFO */

const now =
new Date();


const todayHijri =
getHijri(now);


document.getElementById(
"info"
).innerHTML =

"📅 आज: "
+
now.getDate()
+
" "
+
monthNamesHindi[
now.getMonth()
]
+
" "
+
now.getFullYear()

+
" | 🌙 Hijri: "

+
todayHijri.day
+
" "
+
hijriMonthsHindi[
todayHijri.month - 1
]

+
"<br>"

+
"اردو: "
+
hijriMonthsUrdu[
todayHijri.month - 1
];

}


/* =========================
   PREVIOUS MONTH
========================= */

function previousMonth(){

viewDate.setMonth(
viewDate.getMonth() - 1
);

createCalendar();

}


/* =========================
   NEXT MONTH
========================= */

function nextMonth(){

viewDate.setMonth(
viewDate.getMonth() + 1
);

createCalendar();

}


/* =========================
   TODAY
========================= */

function goToday(){

viewDate =
new Date();

createCalendar();

}


/* =========================
   START
========================= */

createCalendar();


/* =========================
   AUTO UPDATE
========================= */

setInterval(
function(){

const now =
new Date();

if(

viewDate.getFullYear() ===
now.getFullYear()

&&

viewDate.getMonth() ===
now.getMonth()

){

createCalendar();

}

},
60000
);

</script>

</body>
</html>
