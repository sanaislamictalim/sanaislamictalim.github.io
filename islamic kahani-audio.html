<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>इस्लामिक कहानियाँ - Audio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eaf7ef;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #087f5b;
            margin-bottom: 25px;
        }

        .story {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }

        .story h2 {
            color: #087f5b;
            margin-bottom: 15px;
        }

        audio {
            width: 100%;
            margin: 10px 0 15px;
        }

        .story p {
            font-size: 17px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📖 इस्लामिक कहानियाँ 🎧</h1>

    <!-- कहानी 1 -->
    <div class="story">

        <h2>कहानी</h2>

        <audio controls>
            <source src="audio2/kahani1.mp3" type="audio/mpeg">
            आपका ब्राउज़र Audio को सपोर्ट नहीं करता।
        </audio>

        <p>
            
        </p>

    </div>


    <!-- कहानी 2 -->
    <div class="story">

        <h2>कहानी</h2>

        <audio controls>
            <source src="audio2/kahani2.mp3" type="audio/mpeg">
            आपका ब्राउज़र Audio को सपोर्ट नहीं करता।
        </audio>

        <p>
            
        </p>

    </div>


    <!-- कहानी 3 -->
    <div class="story">

        <h2>कहानी</h2>

        <audio controls>
            <source src="audio2/kahani3.mp3" type="audio/mpeg">
            आपका ब्राउज़र Audio को सपोर्ट नहीं करता।
        </audio>

        <p>
            
        </p>

    </div>

</div>
<script>
const audios = document.querySelectorAll("audio");

audios.forEach((audio, index) => {
    audio.addEventListener("ended", function () {
        if (index + 1 < audios.length) {
            audios[index + 1].play();
        }
    });
});
</script>

</body>
</html>
